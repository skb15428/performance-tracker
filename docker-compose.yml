services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: goalcoach
      POSTGRES_PASSWORD: goalcoach
      POSTGRES_DB: goalcoach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goalcoach"]
      interval: 3s
      retries: 10

volumes:
  pgdata:
